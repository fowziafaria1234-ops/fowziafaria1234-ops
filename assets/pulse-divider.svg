<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="92" viewBox="0 0 1100 92" role="img" aria-label="Animated data pulse divider">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="transparent"/>
  <path id="pulse" d="M10 46 H260 L292 46 L315 16 L348 76 L382 30 L416 61 L450 46 H1090"
        fill="none" stroke="#334155" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity=".4"/>
  <path d="M10 46 H260 L292 46 L315 16 L348 76 L382 30 L416 61 L450 46 H1090"
        fill="none" stroke="url(#line)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="18 16">
    <animate attributeName="stroke-dashoffset" values="0;-68" dur="2.2s" repeatCount="indefinite"/>
  </path>
  <circle r="7" fill="#f8fafc" stroke="#2dd4bf" stroke-width="4" filter="url(#glow)">
    <animateMotion dur="5s" repeatCount="indefinite">
      <mpath href="#pulse"/>
    </animateMotion>
  </circle>
</svg>
