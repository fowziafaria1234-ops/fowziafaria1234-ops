    <text x="2" y="103" fill="#FBCFE8" font-family="Segoe UI, Arial, sans-serif" font-size="25">Junior Data Analyst · SQL · Power BI · Excel · Python</text>
    <rect x="0" y="132" width="510" height="7" rx="4" fill="url(#line)">
